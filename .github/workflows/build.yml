# Builds and tests every push to main and every pull request.
# On main, a version in build.gradle.kts that has no release yet is published as one:
# tag v<version>, with the mod jar attached. Bumping the version is what makes a release.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # to create the release; pull requests from forks get a read-only token
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Self-tests
        run: ./gradlew selfTest gameSelfTest --no-daemon

      - name: Find the jar
        id: jar
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts)
          file="build/libs/lightmap-$version.jar"
          test -n "$version" || { echo "no version found in build.gradle.kts"; exit 1; }
          test -f "$file" || { echo "expected $file"; ls -la build/libs; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: lightmap-${{ steps.jar.outputs.version }}
          path: ${{ steps.jar.outputs.file }}

      - name: Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.jar.outputs.version }}
          FILE: ${{ steps.jar.outputs.file }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already released; bump the version in build.gradle.kts to publish a new one."
          else
            gh release create "v$VERSION" "$FILE" --target "$GITHUB_SHA" --title "LightMap $VERSION" --generate-notes
          fi
